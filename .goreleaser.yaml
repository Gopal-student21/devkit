version: 2
project_name: devkit

before:
  hooks:
    - go mod tidy

builds:
  - id: devkit
    main: ./cmd/dev
    binary: dev
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

brews:
  - name: devkit
    homepage: "https://github.com/gopal-student21/devkit"
    description: "DevKit — Universal CLI Dashboard + verification layer for AI-generated code (contract testing, mock server, verify-before-merge)"
    license: "MIT"
    repository:
      owner: gopal-student21
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
